<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="A scanned receipt turning into structured JSON fields">
  <defs>
    <linearGradient id="sde-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sde-bg)"/>

  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- receipt -->
    <path fill="none" stroke-opacity="0.95" d="M130,95 H250 V285 l-15,12 l-15,-12 l-15,12 l-15,-12 l-15,12 l-15,-12 l-15,12 l-15,-12 Z"/>
    <g stroke-opacity="0.75">
      <line x1="157" y1="140" x2="223" y2="140"/>
      <line x1="157" y1="175" x2="205" y2="175"/>
      <line x1="157" y1="210" x2="223" y2="210"/>
      <line x1="157" y1="245" x2="196" y2="245"/>
    </g>

    <!-- arrow -->
    <g stroke-opacity="0.95">
      <line x1="283" y1="194" x2="333" y2="194"/>
      <polyline fill="none" points="316,177 333,194 316,211"/>
    </g>

    <!-- json braces -->
    <g fill="none" stroke-opacity="0.95">
      <path d="M380,125 c-8,0 -12,4 -12,12 v45 c0,8 -4,12 -10,12 c6,0 10,4 10,12 v45 c0,8 4,12 12,12"/>
      <path d="M490,125 c8,0 12,4 12,12 v45 c0,8 4,12 10,12 c-6,0 -10,4 -10,12 v45 c0,8 -4,12 -12,12"/>
    </g>

    <!-- key / value rows, value bars sized like a score -->
    <g>
      <line x1="396" y1="155" x2="428" y2="155" stroke-opacity="0.6"/>
      <line x1="444" y1="155" x2="478" y2="155" stroke-opacity="0.95"/>
      <line x1="396" y1="194" x2="422" y2="194" stroke-opacity="0.6"/>
      <line x1="438" y1="194" x2="478" y2="194" stroke-opacity="0.95"/>
      <line x1="396" y1="233" x2="434" y2="233" stroke-opacity="0.6"/>
      <line x1="450" y1="233" x2="478" y2="233" stroke-opacity="0.95"/>
    </g>
  </g>
</svg>
